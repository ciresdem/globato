[build-system]
requires = ["hatchling>=1.5.0", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "globato"
description = "A suite of specialized data processors (Multibeam, Lidar, Raster), etc. for the Fetchez ecosystem."
readme = "README.md"
license = { file = "LICENSE" }
dynamic = ["version"]
requires-python = ">=3.12"
authors = [{ name = "Matthew Love", email = "matthew.love@colorado.edu" }]
maintainers = [
    {name = "Matthew Love", email = "matthew.love@colorado.edu"},
]
keywords = ["geospatial", "fetchez", "multibeam", "lidar", "etl"]
classifiers = [
    'Programming Language :: Python :: 3',
    'Operating System :: OS Independent',
    'Topic :: Scientific/Engineering :: GIS',
]

dependencies = [
    "fetchez>=0.5.0",
    "transformez>=0.3.0",
    "numpy>1.24",
    "scipy",
    "shapely",
    "laspy[lazrs,laszip]",
    "rasterio>1.4.0",
    "fiona",
    "pandas",
    "pyproj>3.6.1",
    "pyshp",
    "h5py",
]

[project.optional-dependencies]
gmt = ["pygmt"]
gdal = ["gdal"]
verde = ["verde"]

full = ["globato[gmt, gdal, verde]"]

[project.urls]
Homepage = "https://github.com/continuous-dems/globato"
Repository = "https://github.com/continuous-dems/globato"

[project.entry-points."fetchez.modules"]
globato_modules = "globato.modules"

[project.entry-points."fetchez.hooks"]
globato_hooks = "globato.hooks"

[project.entry-points."fetchez.schemas"]
globato_hooks = "globato.schemas"

# [project.entry-points."fetchez.plugins"]
# globato = "globato"

[project.scripts]
globato = "globato.cli.main:main"
fetchez-index = "globato.cli_index:main"
grits = "globato.cli.grits:main"

# --- Build configuration ---

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.version]
path = "src/globato/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/globato"]

[tool.hatch.build.targets.sdist]
include = [
  "src/globato",
  "tests",
  "CHANGELOG.md",
  "CITATION.cff",
  "CONTRIBUTING.md",
  "AUTHORS.md",
]
exclude = [
  ".github",
]

