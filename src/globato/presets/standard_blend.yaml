name: standard_blend
description: "Grids points via multi_stack, pivots the pipeline, and performs a double-pass blend."
hooks:
  # Build the Multi-Band Stack
  # (User arguments like 'res' and 'output' will dynamically inject here)
  - name: multi_stack
    args:
      mode: "mixed"
      crs: "EPSG:4326"

  # Focus the pipeline on the new Stack
  - name: focus_sink
    args: {target: "multi_stack"}

  # Reignite the pipeline for raster operations
  - name: raster_stream
    args:
      stream_type: "raster"
      chunk_size: 2048
      stage: "collection"

  # In-Memory Filters (Double-Pass Blending)
  - name: ms_blend
    args: {weight_threshold: 1.0, blend_dist: 20, random_scale: 0.25}
  # - name: ms_blend
  #   args: {weight_threshold: 0.3, blend_dist: 50, random_scale: 0.25}

  # Write the blended data to disk without breaking the stream
  - name: raster_write
    args:
      suffix: "_final_blend"
      artifact_id: "blended_checkpoint"

  # Drop the stream, update dst_fn, and focus on the blended raster
  - name: focus_sink
    args: {target: "blended_checkpoint"}
