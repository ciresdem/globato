name: etopo-bathy-topo
description: common data sources for coastal relief models
tags:
  - globato
  - bathymetry
  - topography
  - global
  - ETOPO
  - glob-stream
  - glob-bundle
modules:

  # TNM NED 1
  - module: tnm
    args: {weight: 0.5, formats: "GeoTIFF", datasets: "1"}
    hooks:
      - name: raster_flats
        args:
          stage: "file"
      - name: raster_warp
        args: {res: 1s}

      - name: stream_data
      - name: stream_reproject
        args: {dst_srs: "EPSG:4326+3855"}
      - name: point_raster_mask
        args:
          barrier: "coastline"
          invert: False
          res: 1s
      - name: spatial_crop
      - name: range_z
        args: {min_z: 0.01}

  # AK IFSAR
  - module: tnm
    args: {weight: 1.0, formats: "GeoTIFF", datasets: "6"}
    hooks:
      - name: raster_flats
        args:
          stage: "file"
      - name: raster_warp
        args: {res: .33333333s}
      - name: stream_data
      - name: stream_reproject
        args: {dst_srs: "EPSG:4326+3855"}
      - name: point_raster_mask
        args:
          barrier: "coastline"
          invert: False
          res: .3333333s
      - name: spatial_crop
      - name: range_z
        args: {min_z: 0.01}

  - module: copernicus
    args: {weight: .35, datatype: 3}
    hooks:
      - name: unzip
      - name: filename_filter
        args: {match: ".tif"}
      - name: raster_warp
        args: {res: 3s}
      - name: set_datatype
        args:
          data_type: "rasterio"
      - name: stream_data
        args:
          chunk_size: 100000
      - name: range_z
        args: {min_z: 0.01}

  - module: mbdb
    args: {weight: 1, want_inf: True, use_cache: true}
    hooks:
      - name: filename_filter
        args:
          match: ".fbt"
      - name: stream_data
      - name: set-srs
        args:
          src_srs: "EPSG:4326+9003"
      - name: rq
        args:
          reference: "gmrt/gebco/cudem"
          threshold: 5
          mode: "percent"
          builder: "grid"
          res: 0.000277777

  # --- BACKGROUND BATHYMETRY ---
  - module: margrav
    args:
      weight: .01
    hooks:
      - name: set_datatype
        args:
          data_type: "margrav-xyz"
      - name: stream_data
      - name: stream_reproject
        args: {src_srs: "EPSG:4326+9003", dst_srs: "EPSG:4269+3855"}
      - name: range_z
        args:
          max_z: -0.1

    # NOS Hydro surveys
  - module: nos_hydro
    args:
      datatype: "xyz"
      weight: .35
    hooks:
      - name: unzip
      - name: set_datatype
        args:
          data_type: "nos-xyz"
      - name: stream_data
        args:
          chunk_size: 100000
      - name: stream_reproject
        args:
          src_srs: "EPSG:4326+5866"
          dst_srs: "EPSG:4326+3855"
      - name: spatial_crop
      - name: outlierz

  # NOAA Electronic Nautical Charts
  - module: charts
    args:
      weight: .15
    hooks:
      - name: unzip
      - name: filename_filter
        args:
          match: ".000"
          stage: "file"
      - name: set_datatype
        args:
          data_type: "charts-xyz"
      - name: stream_data
        args:
          chunk_size: 100000
      - name: stream_reproject
        args:
          src_srs: "EPSG:4326+5866"
          dst_srs: "EPSG:4326+3855"
      - name: spatial_crop

  # Crowd-Sourced Bathymetry (Fills the gaps)
  - module: csb
    args:
      min_year: "2024"
      max_year: "2025"
      weight: 0.25
    hooks:
      - name: set_datatype
        args:
          data_type: "csb_xyz"
      - name: stream_data
        args:
          chunk_size: 100000
      - name: stream_reproject
        args:
          src_srs: "EPSG:4326+5866"
          dst_srs: "EPSG:4326+3855"
      - name: spatial_crop
      - name: outlierz
