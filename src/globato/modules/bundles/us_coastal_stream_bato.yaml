name: us_coastal_stream
description: >
  The definitive collection for US coastal topobathy.
  Prioritizes high-resolution local LiDAR (CoNED) and USGS topo (TNM),
  backed by dense US bathymetry (NOS Hydro, eHydro). Sets data up for
  global streaming hooks.
modules:
    # --- HIGH RES TOPOGRAPHY ---
  - module: coned
    args: {weight: 5.0}
    hooks:
      - name: filename_filter
        args: {exclude: "Southern_California_Topobathy_DEM_1m_B_01.tif"}
      - name: filename_filter
        args: {exclude: "Southern_California_Topobathy_DEM_1m_B_02.tif"}
      - name: range_z
        args: {min_z: -11000, max_z: 9000}  # Trench to Peak range to remove extreme artifacts.
      - name: stream_reproject
        args: {dst_srs: "EPSG:4326+3855"}
      - name: spatial_crop

  - module: tnm
    args: {weight: 3.0, formats: "GeoTIFF", datasets: "3/4"}
    hooks:
      - name: raster_flats
        args: {stage: "file"}
      - name: stream_data
      - name: stream_reproject
        args: {dst_srs: "EPSG:4326+3855"}
      - name: spatial_crop

  # --- HIGH RES BATHYMETRY ---
  - module: nos_hydro
    args:
      datatype: "bag"
      weight: 3.0
    hooks:
      - name: filename_filter
        args:
          exclude: "_Ellipsoid_"
          stage: "pre"
      - name: stream_data
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
      - name: spatial_crop

  - module: mbdb
    args: {weight: 3.0, want_inf: False}
    hooks:
      - name: stream_data
      - name: stream_reproject
        args: {src_srs: "EPSG:4326+9003", dst_srs: "EPSG:4326+3855"}
      - name: rq
        args:
          reference: "gmrt"
          threshold: 10
          mode: "percent"
          builder: "grid"
          res: 0.000277777

  - module: ehydro
    args: {weight: 2.0}
    hooks:
      - name: set_datatype
        args:
          data_type: "ehydro_gdb"
      - name: stream_data
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"

  # --- BACKGROUND BATHYMETRY ---
  - module: margrav
    args:
      weight: .01
    hooks:
      - name: stream_data
      - name: stream_reproject
        args: {src_srs: "EPSG:4326+9003", dst_srs: "EPSG:4269+3855"}
      - name: range_z
        args:
          max_z: -0.1

    # NOS Hydro surveys
  - module: nos_hydro
    args:
      datatype: "xyz"
      weight: .35
    hooks:
      - name: unzip
      - name: set_datatype
        args:
          data_type: "nos_xyz"
      - name: stream_data
        args:
          chunk_size: 100000
      - name: stream_reproject
        args:
          src_srs: "EPSG:4326+5866"
          dst_srs: "EPSG:4326+3855"
      - name: spatial_crop
      - name: outlierz

  # NOAA Electronic Nautical Charts
  - module: charts
    args:
      weight: .15
    hooks:
      - name: unzip
      - name: filename_filter
        args:
          match: ".000"
          stage: "file"
      - name: set_datatype
        args:
          data_type: "charts_000"
      - name: stream_data
        args:
          chunk_size: 100000
      - name: stream_reproject
        args:
          src_srs: "EPSG:4326+5866"
          dst_srs: "EPSG:4326+3855"
      - name: spatial_crop

  # Crowd-Sourced Bathymetry (Fills the gaps)
  - module: csb
    args:
      min_year: "2024"
      max_year: "2025"
      weight: 0.2
    hooks:
      - name: stream_reproject
        args:
          src_srs: "EPSG:4326+5866"
          dst_srs: "EPSG:4326+3855"
      - name: outlierz

