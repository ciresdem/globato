name: crm-alaska-bathy-topo
desc: >
tags:
  - globato
  - bathymetry
  - topography
  - alaska
  - glob-stream
  - glob-bundle

modules:

  - bundle: crm-bathy-topo
  # IFSAR 5m DEM
  - module: tnm
    args:
      datasets: "6"
      weight: 2
    hooks:
      - name: range_z
        args:
          min_z: 0.001
      - name: spatial_crop

  - module: dnc
    args:
      weight: 0.001
    hooks:
      - name: set-srs
        args:
          srs: "EPSG:4326+5866"
      - name: spatial_crop
      - name: rq
        args:
          reference: gebco
          threshold: 20
          mode: percent
          builder: grid
          res: 0.008333
      - name: outlierz
