name: global-bathy-topo
desc: >
  The definitive collection for US coastal topobathy.
  Prioritizes high-resolution local LiDAR (CoNED) and USGS topo (TNM),
  backed by dense US bathymetry (NOS Hydro, eHydro). Sets data up for
  global streaming hooks.
tags:
  - globato
  - bathymetry
  - topography
  - global
  - glob-stream
  - glob-bundle
modules:
  - module: copernicus
    args: {weight: 1.5, datatype: 3}
    hooks:
      - name: unzip
      - name: filename_filter
        args: {match: ".tif"}
      - name: set_datatype
        args:
          data_type: "rio"
      - name: range_z
        args: {min_z: 0.01}

  - module: copernicus
    args: {weight: .75, datatype: 1}
    hooks:
      - name: unzip
      - name: filename_filter
        args: {match: ".tif"}
      - name: set_datatype
        args:
          data_type: "rio"
      - name: range_z
        args: {min_z: 0.01}

  # Copernicus marine SDB data
  - module: copernicus_marine
    args:
      weight: .5
    hooks:
      - name: set-datatype
        args:
          data_type: copernicus_sdb
      - name: set-srs
        args:
          srs: "EPSG:4326+9003"
      - name: dynamic-weight
        args:
          source_field: confidence
          method: inverse
          offset: 1

  # NCEI Multibeam
  - module: mbdb
    args: {weight: 1, want_inf: False}
    hooks:
      - name: set-srs
        args:
          srs: "EPSG:4326+9003"
      - name: spatial_crop
      - name: rq
        args:
          reference: "gmrt"
          threshold: 10
          mode: "percent"
          builder: "grid"
          res: 0.008333

  # Global Marine Gravity Bathymetry
  - module: sysu
    args:
      weight: .1
    hooks:
      - name: set-datatype
        args:
          data_type: sysu-xyz
      - name: set-srs
        args:
          srs: "EPSG:4326+9003"

  # Global Marine Gravity Bathymetry
  - module: margrav
    args:
      weight: .1
    hooks:
      - name: set-datatype
        args:
          data_type: margrav-xyz
      - name: set-srs
        args:
          srs: "EPSG:4326+9003"
      - name: range_z
        args:
          max_z: -0.1

