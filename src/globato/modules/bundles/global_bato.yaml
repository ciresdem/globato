name: global-bathy-topo
desc: >
  The definitive collection for US coastal topobathy.
  Prioritizes high-resolution local LiDAR (CoNED) and USGS topo (TNM),
  backed by dense US bathymetry (NOS Hydro, eHydro). Sets data up for
  global streaming hooks.
tags:
  - globato
  - bathymetry
  - topography
  - global
  - glob-stream
  - glob-bundle
modules:
  # - module: fabdem
  #   args: {weight: 1.5}
  #   hooks:
  #     - name: unzip
  #     - name: filename_filter
  #       args: {match: ".tif"}
  #     - name: set_datatype
  #       args:
  #         data_type: "rio"
  #     - name: range_z
  #       args: {min_z: 0.01}
  - module: copernicus
    args: {weight: 1.5, datatype: 3}
    hooks:
      - name: unzip
      - name: filename_filter
        args: {match: ".tif"}
      - name: set_datatype
        args:
          data_type: "rio"
      - name: range_z
        args: {min_z: 0.01}

  - module: copernicus
    args: {weight: .75, datatype: 1}
    hooks:
      - name: unzip
      - name: filename_filter
        args: {match: ".tif"}
      - name: set_datatype
        args:
          data_type: "rio"
      - name: range_z
        args: {min_z: 0.01}

  # Copernicus marine SDB data
  - module: copernicus_marine
    args:
      weight: 1.2
    hooks:
      - name: set-datatype
        args:
          data_type: copernicus_sdb
      - name: set-srs
        args:
          srs: "EPSG:4326+9003"
      - name: filter_field
        args:
          field: confidence
          min_val: 1
      - name: dynamic-weight
        args:
          source_field: confidence
          method: linear
          scale: 0.25
          # method: inverse
          # offset: 1.2
      - name: range_z
        args: {max_z: -0.01}

  # NCEI Multibeam
    - module: mbdb
    args: {weight: 1, want_inf: True, use_cache: true}
    hooks:
      - name: filename_filter
        args:
          match: ".fbt"
      - name: stream_data
      - name: set-srs
        args:
          src_srs: "EPSG:4326+9003"
      - name: rq
        args:
          reference: "gmrt/gebco/cudem"
          threshold: 5
          mode: "percent"
          builder: "grid"
          res: 0.000277777

  # Global Marine Gravity Bathymetry
  - module: sysu
    args:
      weight: .1
    hooks:
      - name: set-datatype
        args:
          data_type: sysu-xyz
      - name: set-srs
        args:
          srs: "EPSG:4326+9003"
      - name: rq
        args:
          reference: "gebco"
          threshold: 20
          mode: "percent"
          builder: "grid"
          res: 0.008333

  # Global Marine Gravity Bathymetry
  - module: margrav
    args:
      weight: .1
    hooks:
      - name: set-datatype
        args:
          data_type: margrav-xyz
      - name: set-srs
        args:
          srs: "EPSG:4326+9003"
      - name: range_z
        args:
          max_z: -0.1
      - name: rq
        args:
          reference: "gebco"
          threshold: 20
          mode: "percent"
          builder: "grid"
          res: 0.008333

  - module: csb
    args:
      weight: 0.25
      min_year: null
      max_year: null
      platform: null
      provider: null
      limit: 2000
      outdir: null
      uncertainty: 0.0
      use_cache: true
    hooks:
      - name: set-datatype
        args:
          data_type: csb_xyz
      - name: set-srs
        args:
          srs: "EPSG:4326+9003"
      - name: rq
        args:
          reference: "gebco"
          threshold: 20
          mode: "percent"
          builder: "grid"
          res: 0.008333

