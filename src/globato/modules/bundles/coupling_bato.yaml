---
name: coupling-bathy-topo
description: >
  Data bundle for the Coastal Coupling Workshop.
modules:
- module: csb
  args:
    weight: 0.25
    limit: 2000
  hooks:
  - name: set-datatype
    args:
      data_type: csb_xyz
  - name: stream_reproject
    args:
      src_srs: EPSG:4326+9003
      dst_srs: EPSG:4269+5703
  - name: rq
    args:
      reference: gebco
      threshold: 20
      mode: percent
      builder: grid
      res: 3.0864197222222225e-05
- module: nos_hydro
  args:
    datatype: bag
    weight: 3.0
  hooks:
  - name: filename_filter
    args:
      exclude: Ellipsoid
      stage: pre
  - name: set_datatype
    args:
      data_type: bag
  - name: stream_reproject
    args:
      dst_srs: epsg:4269+5703
  - name: spatial_crop
- module: nos_hydro
  args:
    datatype: xyz
    weight: 0.35
  hooks:
  - name: unzip
  - name: set_datatype
    args:
      data_type: nos-xyz
  - name: stream_reproject
    args:
      src_srs: EPSG:4326+5866
      dst_srs: EPSG:4269+5703
  - name: spatial_crop
  - name: outlierz
  - name: range_z
    args:
      max_z: -0.01
- module: charts
  args:
    weight: 0.15
  hooks:
  - name: unzip
  - name: filename_filter
    args:
      match: '.000'
      stage: file
  - name: set_datatype
    args:
      data_type: charts-xyz
  - name: stream_reproject
    args:
      src_srs: EPSG:4326+5866
      dst_srs: EPSG:4269+5703
  - name: spatial_crop
- module: tnm
  args:
    weight: 5.0
    datasets: '4'
  hooks:
  - name: unzip
  - name: filename_filter
    args:
      match: .img
  - name: filename_filter
    args:
      exclude: .xml
  - name: raster_flats
    args:
      stage: file
  - name: stream_reproject
    args:
      dst_srs: EPSG:4269+5703
  - name: point_raster_mask
    args:
      barrier: coastline
      invert: false
      res: 3.0864197222222225e-05
  - name: range_z
    args:
      min_z: 0.01
- module: ehydro
  args:
    weight: 1.25
    min_year: 2025
    max_year: 2026
  hooks:
  - name: set_datatype
    args:
      data_type: ehydro-xyz
  - name: stream_reproject
    args:
      dst_srs: EPSG:4269+5703
  - name: outlierz
- module: dav
  hooks:
  - name: stream_reproject
    args:
      dst_srs: epsg:4269+5703
  args:
    survey_id: 9693
    weight: 100
