---
name: crm-bathy-topo
description: >
  Common data sources for coastal relief models.
  Adds some US-specific datasets to the global-bathy-topo bundle.
  Built for 1/3 arc-seconds @ epsg:4326+3855
tags:
  - globato
  - bathymetry
  - topography
  - crm
  - glob-stream
  - glob-bundle
modules:
  - bundle: global-bathy-topo
    hooks:
      - name: raster_warp
        args:
          res: 1s
          # res: 1s
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"
          # dst_srs: "EPSG:4326+3855"

  # TNM NED 1
  - module: tnm
    args: {weight: 0.5, formats: "GeoTIFF", datasets: "1"}
    hooks:
      - name: raster_flats
        args:
          stage: "file"
      - name: raster_warp
        args: {res: 1s}

      - name: stream_data
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"
      - name: point_raster_mask
        args:
          barrier: "coastline"
          invert: False
          res: 1s
      - name: spatial_crop
      - name: range_z
        args: {min_z: 0.01}

  # TNM NED 1/3
  - module: tnm
    args: {weight: 1.0, formats: "GeoTIFF", datasets: "3"}
    hooks:
      - name: raster_flats
        args:
          stage: "file"
      - name: raster_warp
        args: {res: 1s}
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"
      - name: point_raster_mask
        args:
          barrier: "coastline"
          invert: False
          res: 1s
      - name: spatial_crop
      - name: range_z
        args: {min_z: 0.01}

  # --- HIGH RES BATHYMETRY ---
  - module: nos_hydro
    args:
      datatype: bag
      weight: 3.0
    hooks:
    - name: filename_filter
      args:
        exclude: Ellipsoid
        stage: pre
    - name: set_datatype
      args:
        data_type: bag
    - name: stream_reproject
      args:
        dst_srs: "EPSG:4326+3855"
        cache_dir: "%shared_cache%"
    - name: spatial_crop

  # - module: mbdb
  #   args: {weight: 0.75, want_inf: True, use_cache: true}
  #   hooks:
  #     - name: filename_filter
  #       args:
  #         match: ".fbt"
  #     - name: stream_data
  #     - name: set-srs
  #       args:
  #         src_srs: "EPSG:4326+9003"
  #     - name: rq
  #       args:
  #         reference: "gmrt/gebco/cudem"
  #         threshold: 5
  #         mode: "percent"
  #         builder: "grid"
  #         res: 0.000277777

    # NOS Hydro surveys
  - module: nos_hydro
    args:
      datatype: "xyz"
      weight: .35
    hooks:
      - name: unzip
      - name: set_datatype
        args:
          data_type: "nos-xyz"
      - name: stream_data
        args:
          chunk_size: 100000
      - name: stream_reproject
        args:
          src_srs: "EPSG:4326+5866"
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"
      - name: spatial_crop
      - name: outlierz
      - name: range_z
        args: {max_z: -0.01}

  # NOAA Electronic Nautical Charts
  - module: charts
    args:
      weight: .15
    hooks:
      - name: unzip
      - name: filename_filter
        args:
          match: ".000"
          stage: "file"
      - name: set_datatype
        args:
          data_type: "charts-xyz"
      - name: stream_data
        args:
          chunk_size: 100000
      - name: stream_reproject
        args:
          src_srs: "EPSG:4326+5866"
          dst_srs: "EPSG:4326+3855"
          cache_dir: "%shared_cache%"
      - name: spatial_crop
