---
name: glob-charts
description: "NOS ENC charts bathymetry."
tags:
  - globato
  - bathymetry
  - charts
  - glob-stream
modules:
  - module: charts
    args:
      weight: .15
    hooks:
      - name: unzip
      - name: filename_filter
        args:
          match: ".000"
          stage: "file"
      - name: set_datatype
        args:
          data_type: "charts-xyz"
      - name: set_srs
        args:
          src_srs: "EPSG:4326+5866"
      - name: stream_reproject
        args:
          cache_dir: "%shared_cache%"
      - name: spatial_crop
