---
name: cudem-bathy-topo
description: >
  Common data sources for CUDEMs.
  1/9 arc-second at EPSG:4269+5703
modules:

  # CRM standard bundle
  - bundle: crm-bathy-topo
    hooks:
      - name: raster_warp
        args:
          res: .111111111s
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4269+5703"

  # High-priority topobathymetric lidar.
  - module: dav
    args:
      weight: 100
      survey_id: "9693"
    hooks:
      - name: stream_data
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4269+5703"
      - name: spatial_crop

  # Topographic lidar. Mask invalid surface returns over water.
  - module: dav
    args:
      weight: 10
      survey_id: "575"
    hooks:
      - name: stream_data
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4269+5703"
      - name: point_raster_mask
        args:
          barrier: osm
          invert: false
          res: "1s"
      - name: spatial_crop

  # --- HIGH RES TOPOGRAPHY ---
  # - module: coned
  #   args: {weight: 5.0}
  #   hooks:
  #     - name: filename_filter
  #       args: {exclude: "Southern_California_Topobathy_DEM_1m_B_01.tif"}
  #     - name: filename_filter
  #       args: {exclude: "Southern_California_Topobathy_DEM_1m_B_02.tif"}
  #     - name: stream_data
  #     - name: range_z
  # Trench to Peak range to remove extreme artifacts.
  #       args: {min_z: -11000, max_z: 9000}
  #     - name: stream_reproject
  #       args: {dst_srs: "EPSG:4326+3855"}
  #     - name: spatial_crop

  # TNM NED 1m and 1/9
  - module: tnm
    args: {weight: 5.0, formats: "GeoTIFF", datasets: "2/4"}
    hooks:
      - name: raster_flats
        args:
          stage: "file"
      - name: stream_reproject
        args: {dst_srs: "EPSG:4269+5703"}
      - name: point_raster_mask
        args:
          barrier: "coastline"
          invert: false
          res: .11111111s
      - name: range_z
        args: {min_z: 0.01}

  # USACE eHydro.
  - module: ehydro
    args:
      weight: 1.25
    hooks:
      - name: set_datatype
        args:
          data_type: "ehydro-xyz"
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4269+5703"
      - name: outlierz
