name: mr-globato
description: "The standard Multi-Resolution Global Bathymetry and Topography pipeline."
hooks:
  - name: spatial-crop
  - name: audit
  - name: enrich
  - name: transfer_log
  - name: drop_class
  - name: provenance
    args:
      res: 3s
      output: "%name%_%batch_name%_provenance.tif"

  - name: source_masks
    args:
      res: 3s
      output: "%name%_%batch_name%_sources.vrt"

  - name: multi_stack
    args:
      res: 3s
      crs: epsg:4326+3855
      mode: mixed
      nodata: -9999.0
      weight_threshold: 0.5/.25
      output: "%name%_%batch_name%_stack.tif"

  - name: focus_sink
    args:
      target: multi_stack

  - name: raster_stream
    args:
      stream_type: raster
      chunk_size: 2048
      stage: collection

  # - name: ms_blend
  #   args:
  #     weight_threshold: 1.0
  #     blend_dist: 60

  # - name: ms_blend
  #   args:
  #     weight_threshold: 0.5
  #     blend_dist: 60

  # - name: ms_blend
  #   args:
  #     weight_threshold: 0.25
  #     blend_dist: 60

  # # Save the blended stack without breaking the active raster stream.
  # - name: raster_write
  #   args:
  #     suffix: _final_blend
  #     artifact_id: blended_checkpoint

  # - name: focus_sink
  #   args:
  #     target: blended_checkpoint

  - name: ms_binary_cudem
    args:
      resolutions: 3s/9s/15s
      weights:
        - 0.5
        - 0.25
      steps: 2
      blend_dists: 2/10/02
      barrier: osm
      algos: "interp_gmt:tension=.75"
      # algos: interp_rbf
      output: "%name%_%batch_name%.tif"

  - name: focus_sink
    args: {target: "ms_binary_cudem"}

  - name: raster_metadata
    args:
      tags: "Project=Coastal Relief Model,Version=6,Author=NCEI"
      bands: "Elevation (meters)"

  # - name: raster_cut
  #   args:
  #     region: batch_region

  # - name: raster_crop
  #   args:
  #     output: "%name%_%batch_name%_final.tif"

  - name: format_cog
    args:
      overviews: 2/4/8/16/32
      resampling: average

  - name: viz_geoshade
    args:
      output: "%name%_%batch_name%_hs.tif"
      cmap: coastal_relief

