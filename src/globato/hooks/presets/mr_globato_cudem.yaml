name: mr-globato-cudem
description: "The standard CUDEM step-down, trim, and visualize pipeline."
hooks:
  - preset: mr-globato
    args:
      res: .11111111s
      weight_threshold: 3.0/2.0/1.0/0.5/.25
      resolutions: .11111111s/.33333333s/1s/3s/9s/15s
      weights:
        - 3.0
        - 2.0
        - 1.0
        - 0.5
        - 0.25
      steps: 5
      blend_dists: 270/90/30/10/3/2
      tags: "Project=CUDEM,Author=NCEI"

