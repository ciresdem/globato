project:
  name: "crm_standard"
  description: >
    Production-grade 1-arc-second Coastal Relief Model.
    Blends high-res local topo (CoNED, 3DEP) with dense bathymetry
    (MBDB, NOS, eHydro) and fills deep water with GEBCO.
    Includes an embedded Spatial Uncertainty Band (Band 2).

execution:
  threads: 4

schema: crm

modules:
  # --- HIGH RES TOPOGRAPHY ---
  - module: coned
    args: {weight: 5.0}
    hooks:
      - name: filename_filter
        args: {exclude: "Southern_California_Topobathy_DEM_1m_B_01.tif"}
      - name: filename_filter
        args: {exclude: "Southern_California_Topobathy_DEM_1m_B_02.tif"}
      - name: stream_data
      - name: range_z
        args: {min_z: -11000, max_z: 9000}  # Trench to Peak range to remove extreme artifacts.
      - name: stream_reproject
        args: {dst_srs: "EPSG:4326+3855"}
      - name: spatial_crop

  - module: tnm
    args: {weight: 3.0, formats: "GeoTIFF", datasets: "3/4"}
    hooks:
      - name: raster_flats
        args: {stage: "file"}
      - name: stream_data
      - name: stream_reproject
        args: {dst_srs: "EPSG:4326+3855"}
      - name: spatial_crop

  - module: copernicus
    args: {weight: 1.0, datatype: 3}
    hooks:
      - name: unzip
      - name: filename_filter
        args: {match: ".tif"}
      - name: stream_data
        args:
          chunk_size: 100000
      - name: range_z
        args: {min_z: 0.01}

  # --- HIGH RES BATHYMETRY ---
  - module: nos_hydro
    args:
      datatype: "bag"
      weight: 3.0
    hooks:
      - name: filename_filter
        args:
          exclude: "_Ellipsoid_"
          stage: "pre"
      - name: stream_data
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"
      - name: spatial_crop

  # - module: multibeam
  - module: mbdb
    args: {weight: 3.0, want_inf: False}
    hooks:
      - name: stream_data
      - name: stream_reproject
        args: {src_srs: "EPSG:4326+9003", dst_srs: "EPSG:4326+3855"}
      - name: rq
        args:
          reference: "gmrt"
          threshold: 10
          mode: "percent"
          builder: "grid"
          res: 0.000277777

  - module: ehydro
    args: {weight: 2.0}
    hooks:
      - name: set_datatype
        args:
          data_type: "ehydro_gdb"
      - name: stream_data
      - name: stream_reproject
        args:
          dst_srs: "EPSG:4326+3855"

  # --- BACKGROUND BATHYMETRY ---
  - module: margrav
    args:
      weight: .01
    hooks:
      - name: set_datatype
        args:
          data_type: "margrav-xyz"
      - name: stream_data
      - name: stream_reproject
        args: {src_srs: "EPSG:4326+9003", dst_srs: "EPSG:4269+3855"}
      - name: range_z
        args:
          max_z: -0.1

    # NOS Hydro surveys
  - module: nos_hydro
    args:
      datatype: "xyz"
      weight: .35
    hooks:
      - name: unzip
      - name: set_datatype
        args:
          data_type: "nos-xyz"
      - name: stream_data
        args:
          chunk_size: 100000
      - name: stream_reproject
        args:
          src_srs: "EPSG:4326+5866"
          dst_srs: "EPSG:4326+3855"
      - name: spatial_crop
      - name: outlierz

  # NOAA Electronic Nautical Charts
  - module: charts
    args:
      weight: .15
    hooks:
      - name: unzip
      - name: filename_filter
        args:
          match: ".000"
          stage: "file"
      - name: set_datatype
        args:
          data_type: "charts_000"
      - name: stream_data
        args:
          chunk_size: 100000
      - name: stream_reproject
        args:
          src_srs: "EPSG:4326+5866"
          dst_srs: "EPSG:4326+3855"
      - name: spatial_crop

  # Crowd-Sourced Bathymetry (Fills the gaps)
  - module: csb
    args:
      min_year: "2024"
      max_year: "2025"
      weight: 0.2
    hooks:
      - name: set_datatype
        args:
          data_type: "csb_csv"
      - name: stream_data
        args:
          chunk_size: 100000
      - name: stream_reproject
        args:
          src_srs: "EPSG:4326+5866"
          dst_srs: "EPSG:4326+3855"
      - name: spatial_crop
      - name: outlierz

  # - module: gebco_cog
  #   args: {weight: 0.1}
  #   hooks:
  #     - name: stream_data
  #     - name: stream_reproject
  #       args: {src_srs: "EPSG:4326+9003", dst_srs: "EPSG:4326+3855"}
  #     - name: range_z
  #       args: {max_z: -0.1}

global_hooks:
  - name: audit
  - name: enrich
  - name: transfer_log
  - name: drop_class

  - name: stash_entries
    args:
      key: "clean_raw_data"

  - name: source_masks
    args:
      res: "1s"
      output: "crm_standard_provenance.tif"

  - name: provenance
    args:
      res: "1s"

  - name: multi_stack
    args:
      res: "1s"
      mode: "mixed"
      crs: "EPSG:4326"
      output: "crm_standard_stack.tif"

  - name: focus_sink
    args: {target: "multi_stack"}

  - name: raster_stream
    args: {stream_type: "raster", chunk_size: 2048, stage: "collection"}

  - name: ms_blend
    args: {weight_threshold: 1.0, blend_dist: 20}

  - name: ms_blend
    args: {weight_threshold: 0.3, blend_dist: 50}

  # Writes the blended data to disk without breaking the stream
  - name: raster_write
    args:
      suffix: "_final_blend"
      artifact_id: "blended_checkpoint"

  - name: focus_sink
    args:
      target: "blended_checkpoint"

  # The CUDEM Multi-Resolution Step-Down Interpolator
  - name: ms_cudem
    args:
      steps: 2
      resolutions: ["1s", "3s", "9s"]
      weights: [1.0, 0.5, 0.1]
      blend_dist: 1
      algo: "interp_gmt"
      #algo: raster_fill
      # barrier: "coastline"
      output: "crm_standard_dem.tif"

  - name: focus_sink
    args: {target: "ms_cudem"}

  - name: raster_metadata
    args:
      tags: "Project=Coastal Relief Model,Version=6,Author=NCEI"
      bands: "Elevation (meters)"

  # # Uncertainty
  # - name: dem_uncertainty
  #   args:
  #     mode: "split_sample"
  #     algo: "interp_gmt"
  #     fit_method: "curve"
  #     append_band: true

  # Generate a hillshade.
  - name: viz_geoshade
    args:
      cmap: "etopo"
      blend_mode: "soft_light"
      output: "crm_standard_dem_hillshade.tif"

  # --- PREPARE THE SOURCE MASKS DELIVERY ---
  - name: restore_entries
    args: {key: "clean_raw_data"}

  - name: source_masks

  - name: focus_sink
    args: {target: "source_masks"}

  - name: build_multiband
    args: {output: "crm_standard_provenance_bands.tif"}

  - name: focus_sink
    args: {target: "build_multiband"}

  - name: raster_metadata
    args:
      tags: "Project=Coastal Relief Model,Description=Source Contribution Masks"
