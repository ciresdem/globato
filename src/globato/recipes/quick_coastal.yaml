project:
  name: "quick_coastal"
  description: >
    Fast coastal DEM using Raster data sources for fast results.
    Target resolution: 3 arc-seconds.

execution:
  threads: 4

# Region is deliberately omitted so the CLI forces the user to provide -R
# region:

modules:
  - module: copernicus
    args: {weight: 2.0, datatype: 1}
    hooks:
      - name: unzip
      - name: filename_filter
        args: {match: ".tif"}
      - name: stream_data
      - name: stream_reproject
        args:
          src_srs: "EPSG:4326+3855"
          dst_srs: "EPSG:4326+3855"
      - name: raster_clip
        args:
          barrier: "coastline"
      - name: range_z
        args: {min_z: 0.01} # Strict Topo

  # - module: gebco_cog
  #   args: {weight: 1.0}
  #   hooks:
  #     - name: stream_data
  #     - name: stream_reproject
  #       args:
  #         src_srs: "EPSG:4326+9003"
  #         dst_srs: "EPSG:4326+3855"
  #     # - name: raster_clip
  #     #   args:
  #     #     barrier: "coastline"
  #     - name: range_z
  #       args: {max_z: -0.01} # Strict Bathy

  - module: gmrt
    args: {weight: .5}
    hooks:
      - name: stream_data
      - name: stream_reproject
        args:
          src_srs: "EPSG:4326+3855"
          dst_srs: "EPSG:4326+3855"
      - name: range_z
        args: {max_z: -0.01} # Strict Bathy

  # - module: mbdb
  #   args: {weight: 0.75, want_inf: False}
  #   hooks:
  #     - name: stream_data
  #     - name: stream_reproject
  #       args: {src_srs: "EPSG:4326+9003", dst_srs: "EPSG:4326+3855"}
  #     - name: spatial_crop
  #     - name: rq
  #       args:
  #         reference: "gmrt"
  #         threshold: 10
  #         mode: "percent"
  #         builder: "grid"
  #         res: 0.008333

  # - module: nos_hydro
  #   args: {datatype: "bag", weight: 1.25}
  #   hooks:
  #     - name: filename_filter
  #       args: {exclude: "_Ellipsoid_", stage: "pre"}
  #     - name: stream_data
  #      # args: {chunk_size: 100000}
  #     - name: stream_reproject
  #       args: {dst_srs: "EPSG:4326+3855"}
  #     - name: spatial_crop

  - module: nos_hydro
    args: {datatype: "xyz", weight: 0.35}
    hooks:
      - name: unzip
      - name: set_datatype
        args: {data_type: "nos_xyz"}
      - name: stream_data
       # args: {chunk_size: 100000}
      - name: stream_reproject
        args: {src_srs: "EPSG:4326+5866", dst_srs: "EPSG:4326+3855"}
      - name: spatial_crop

  - module: charts
    args: {weight: 0.15}
    hooks:
      - name: unzip
      - name: filename_filter
        args: {match: ".000", stage: "file"}
      - name: set_datatype
        args: {data_type: "charts_000"}
      - name: stream_data
       # args: {chunk_size: 100000}
      - name: stream_reproject
        args: {src_srs: "EPSG:4326+5866", dst_srs: "EPSG:4326+3855"}
      - name: spatial_crop

global_hooks:
  # Dynamically fetch OSM coastline to act as a barrier between topo and bathy
  - name: osm_landmask
    args: {filename: "temp_coastline.geojson"}
  - name: audit
  - name: drop_class
  - name: provenance
    args:
      res: 3s
      output: "quick_coastal_provenance.tif"
  - name: multi_stack
    args:
      res: 3s
      mode: "mixed"
      crs: "EPSG:4326"
      output: "quick_coastal_stack.tif"

  - name: focus_sink
    args: {target: "multi_stack"}

  - name: raster_stream
    args: {stream_type: "raster", chunk_size: 2048, stage: "collection"}

  - name: ms_blend
    args:
      weight_threshold: .5

  # Writes the blended data to disk without breaking the stream
  - name: raster_write
    args:
      suffix: "_final_blend"
      artifact_id: "blended_checkpoint"

  - name: focus_sink
    args:
      target: "blended_checkpoint"

  # Fast interpolation (No need for CUDEM step-down since GEBCO is global)
  - name: interp_gmt
    args:
      tension: 0.35
      # barrier: "temp_coastline.geojson"
      output: "quick_coastal_dem.tif"

  # Generate a beautiful colored hillshade automatically!
  - name: viz_geoshade
    args:
      cmap: "etopo"
      blend_mode: "soft_light"
