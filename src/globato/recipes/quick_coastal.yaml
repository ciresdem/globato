project:
  name: "quick_coastal"
  description: >
    Fast coastal DEM using Raster data sources for fast results.
    Target resolution: 3 arc-seconds. By default no vertical transformations
    are performed; resulting in an AMSL output vertical datum.

execution:
  threads: 4

# Region is deliberately omitted so the CLI forces the user to provide -R
# region:

modules:
  # --- Global Sources ---
  - module: copernicus
    args:
      weight: 2.0
      datatype: 1
    hooks:
      - name: unzip
      - name: filename_filter
        args: {match: ".tif"}
      - name: stream_data
      - name: stream_reproject
        args:
          src_srs: "EPSG:4326+3855"
      - name: range_z
        args: {min_z: 0.01} # Strict Topo

  - module: margrav
    args:
      weight: .2
    hooks:
      - name: stream_data
      - name: stream_reproject
        args: {src_srs: "EPSG:4326+9003"}
      - name: range_z
        args:
          max_z: -0.1

  - module: gmrt
    args:
      weight: .25
      layer: "topo-mask"  # no gebco fill
    hooks:
      - name: stream_data
      - name: stream_reproject
        args:
          src_srs: "EPSG:4326+3855"
      - name: range_z
        args:
          max_z: -0.01  # Strict Bathy

  # --- Some quick US bathy sources. ---
  - module: dnc
    args:
      weight: .01
    hooks:
      - name: stream_data
      - name: stream_reproject
        args:
          src_srs: "EPSG:4326+5866"

  - module: nos_hydro
    args:
      datatype: "xyz"
      weight: 0.35
    hooks:
      - name: unzip
      - name: set_datatype
        args: {data_type: "nos_xyz"}
      - name: stream_data
      - name: stream_reproject
        args:
          src_srs: "EPSG:4326+5866"
      - name: spatial_crop

  - module: charts
    args:
      weight: 0.15
    hooks:
      - name: unzip
      - name: filename_filter
        args: {match: ".000", stage: "file"}
      - name: set_datatype
        args: {data_type: "charts_000"}
      - name: stream_data
      - name: stream_reproject
        args:
          src_srs: "EPSG:4326+5866"
      - name: spatial_crop

  # --- Europe Sources ---
  - module: emodnet
    args:
      weight: 1
    hooks:
      - name: stream_data
      - name: stream_reproject
        args:
          src_srs: "EPSG:4326+5866"
      - name: range_z
        args:
          max_z: -0.1
      - name: spatial_crop

global_hooks:
  # fetch OSM coastline to act as a barrier between topo and bathy
  #- name: osm_landmask
  #  args: {filename: "temp_coastline.geojson"}
  - name: audit
  - name: drop_class
  - name: source_masks
    args:
      res: 3s
      output: "quick_coastal_sources.tif"
  - name: provenance
    args:
      res: 3s
      output: "quick_coastal_provenance.tif"
  - name: multi_stack
    args:
      res: 3s
      mode: "mixed"
      crs: "EPSG:4326"
      output: "quick_coastal_stack.tif"

  - name: focus_sink
    args: {target: "multi_stack"}

  - name: raster_stream
    args: {stream_type: "raster", chunk_size: 2048, stage: "collection"}

  - name: ms_blend
    args:
      weight_threshold: .5

  # Writes the blended data to disk without breaking the stream
  - name: raster_write
    args:
      suffix: "_final_blend"
      artifact_id: "blended_checkpoint"

  - name: focus_sink
    args:
      target: "blended_checkpoint"

  - name: ms_cudem
    args:
      resolutions: "3s/9s"
      weights: ".5/0.1"
      algo: "raster_fill"  # use raster_fill for lower dependencies.
      barrier: "osm"  # OSM coastline, fast and global.
      blend_dist: 1  # Only blend one cell for coarse data.
      output: "quick_coastal_dem.tif"

  # Generate a hillshade.
  - name: viz_geoshade
    args:
      cmap: "etopo"
      blend_mode: "soft_light"
