<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 300 200"
    width="300"
    height="200"
    role="img"
    aria-labelledby="title desc">
  <title id="title">Globato colored logo</title>
  <desc id="desc">Six rounded terrain-colored tiles crossed by a transparent visor.</desc>
  <defs>
    <mask id="visorCut" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="200">
      <rect width="300" height="200" fill="white"/>
      <rect
	  fill="black"
	  id="rect1868"
	  width="82"
	  height="30"
	  x="130"
	  y="20"
	  rx="16"/>
    </mask>
  </defs>

  <g mask="url(#visorCut)">
    <rect x="4" y="4" width="92" height="92" rx="16" fill="#85B58D"/>
    <rect x="104" y="4" width="92" height="92" rx="16" fill="#828D98"/>
    <rect x="204" y="4" width="92" height="92" rx="16" fill="#D4BE9D"/>
    <rect x="4" y="104" width="92" height="92" rx="16"  fill="#B5C18E "/>
    <rect x="104" y="104" width="92" height="92" rx="16" fill="#5482B4"/>
    <rect x="204" y="104" width="92" height="92" rx="16" fill="#2B4C7E"/>
  </g>
</svg>
