<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    viewBox="0 0 300 200"
    width="300"
    height="200"
    version="1.1"
    id="svg178"
    shape-rendering="crispEdges"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:svg="http://www.w3.org/2000/svg">
  <!-- MR. GLOBATO ETOPO STYLE DEFINITIONS -->
  <style>
    rect {
    stroke-width: 4.8;
    stroke-linejoin: round;
    rx: 0.65px;
    stroke: #000000;
    stroke-width: 0.14px;
    stroke-opacity: 0.425;
    }
    .ROBO-STEEL { fill: #C8CFD5; stroke: #828D98; } /* Primary Steel Optic */
    .GREY-ABYSS { fill: #4A586E; stroke: #2D3746; } /* Industrial Deep Ocean Visor */
    .GREY-SHAL  { fill: #768798; stroke: #4A586E; } /* Metallic Shallow Blue Lens */
    .GREY-LOW   { fill: #7F9384; stroke: #2D3746; } /* Oxidized Green Armor Plate */
    .GREY-PEAK  { fill: #8E7E77; stroke: #544A46; } /* Iron Ore Core / Mouth Vent */
    .GREY-HIGH  { fill: #A8A093; stroke: #6E685F; } /* Dull Titanium Armor Plate */
    .BORDER { fill: none; stroke:#000000; stroke-width:16; } /* Border */
  </style>

  <!-- ROW 1 (Y=0): The Upper Atmosphere & Polar Ice Cap -->
  <rect x="0"   y="0" rx="0.64999998" width="100" height="100" class="ROBO-STEEL" />
  <rect x="100" y="0" rx="0.64999998" width="100" height="100" class="GREY-ABYSS" />
  <rect x="200" y="0" rx="0.64999998" width="100" height="100" class="GREY-SHAL" />

  <!-- ROW 2 (Y=100): The Continent Shoulders & Oceanic Face -->
  <rect x="0"   y="100" rx="0.64999998" width="100" height="100" class="GREY-LOW" />
  <rect x="100" y="100" rx="0.64999998" width="100" height="100" class="GREY-PEAK" />
  <rect x="200" y="100" rx="0.64999998" width="100" height="100" class="GREY-HIGH" />

  <rect
      id="rect7323"
      width="300"
      height="200"
      x="0"
      y="0"
      rx="1.8574402"
      class="BORDER"/>
</svg>
